name: Update open pharmacies

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Optional date in YYYY-MM-DD format"
        required: false
        type: string
  schedule:
    - cron: "30 13 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"

      - name: Update pharmacy data
        run: |
          DATE_INPUT="${{ github.event.inputs.date }}"

          if [ -n "$DATE_INPUT" ]; then
            php scripts/update-open-pharmacies.php --date="$DATE_INPUT"
          else
            php scripts/update-open-pharmacies.php
          fi

      - name: Commit updated data
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add data/open-pharmacies.json

          git diff --cached --quiet || git commit -m "Update open pharmacies"
          git push
